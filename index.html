
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crèche Yona Compagnie</title>
<style>
:root{--green:#315d4d;--pale:#dcebe1;--bg:#f6f5f0;--ink:#24342e;--muted:#7b8780;--line:#e8e9e2;--white:#fff;--pink:#f5dcd6;--yellow:#f7edc9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 13px}.primary{background:var(--green);color:white;font-weight:700}.secondary{background:white;border:1px solid var(--line);color:var(--ink)}.app{display:grid;grid-template-columns:225px 1fr;min-height:100vh}aside{background:white;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:10px;padding:5px}.logo{background:var(--green);color:white;border-radius:13px;padding:12px;font-size:21px}.brand strong{display:block;font-size:13px}.brand small{color:var(--muted);font-size:11px}.navtitle{font-size:10px;color:var(--muted);letter-spacing:1px;padding:8px}.nav{display:grid;gap:5px}.nav button{text-align:left;background:transparent;color:#65746a;font-size:12px;font-weight:650}.nav button.active,.nav button:hover{background:var(--pale);color:var(--green)}.sidebottom{margin-top:auto;padding:13px;background:#f7f4eb;border-radius:14px;font-size:11px;line-height:1.6;color:var(--muted)}main{padding:28px;max-width:1500px;width:100%;margin:auto;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:1.4px;font-weight:800}.topbar h1{font-size:clamp(23px,3vw,31px);margin:5px 0;letter-spacing:-1px}.date{color:var(--muted);font-size:11px}.hero{background:var(--green);color:white;border-radius:20px;padding:26px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:18px}.hero h2{font-size:30px;line-height:1.15;margin:10px 0}.hero p{color:#d7e4dc;line-height:1.6;font-size:12px;max-width:470px}.hero .primary{background:#f2c18c;color:#314b3c}.heroart{font-size:66px}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:17px;min-width:0}.statlabel{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}.statvalue{font-size:25px;font-weight:800;margin:13px 0 5px;letter-spacing:-.7px}.statfoot{font-size:10px;color:var(--muted)}.columns{grid-template-columns:1.2fr 1fr}.panel{margin-bottom:15px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.panelhead h3{font-size:14px;margin:0}.panelhead p{font-size:11px;color:var(--muted);margin:5px 0}.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.quick button{background:#fafaf7;border:1px solid var(--line);text-align:left;padding:14px}.quick button span{display:block;font-size:22px;margin-bottom:8px}.quick button b{font-size:12px}.quick button small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.activity{padding:12px 0;border-bottom:1px solid #f0f1ec;display:flex;gap:10px;align-items:flex-start}.activity:last-child{border-bottom:0}.bubble{background:var(--pale);padding:9px;border-radius:10px}.activity b{font-size:12px}.activity small{display:block;color:var(--muted);font-size:11px;margin-top:4px;line-height:1.5}.pill{display:inline-block;background:var(--pale);color:var(--green);padding:5px 9px;border-radius:20px;font-size:10px;font-weight:750}.warn{background:var(--yellow);color:#82651d}.bad{background:var(--pink);color:#9c574b}.intro{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:5px 0 20px}.intro h2{font-size:23px;margin:0 0 5px;letter-spacing:-.6px}.intro p{color:var(--muted);font-size:12px;margin:0;line-height:1.5}.filters{display:flex;gap:8px;margin-bottom:14px}.filters input{flex:1;min-width:0}input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:10px;background:white;color:var(--ink);width:100%;font-size:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;color:var(--muted);font-size:10px;padding:11px 9px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:12px 9px;border-bottom:1px solid #f0f1ec;white-space:nowrap}tr:last-child td{border-bottom:0}.person{display:flex;gap:8px;align-items:center}.initial{background:var(--pink);border-radius:9px;padding:9px;font-size:10px;font-weight:800}.muted{color:var(--muted);font-size:11px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}.field label{display:block;font-size:11px;font-weight:750;margin-bottom:6px}.field.full{grid-column:1/-1}.modalback{position:fixed;inset:0;background:#17231f99;z-index:10;display:grid;place-items:center;padding:15px}.modal{width:min(500px,100%);max-height:90vh;overflow:auto;background:white;padding:22px;border-radius:18px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h3{margin:0}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.notice{padding:12px;background:#f8f3e6;color:#786634;border-radius:11px;font-size:11px;line-height:1.6;margin:12px 0}.bar{height:7px;border-radius:10px;background:#edf0ea;overflow:hidden;margin:7px 0 15px}.bar span{height:100%;display:block;background:var(--green)}.metric{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.metric:last-child{border:0}.toast{position:fixed;bottom:20px;right:20px;background:#243b30;color:white;padding:13px 18px;border-radius:12px;z-index:30;font-size:12px}.empty{text-align:center;padding:22px;color:var(--muted)}.calendar{display:grid;grid-template-columns:repeat(5,minmax(110px,1fr));gap:8px;overflow:auto}.day{background:#fafaf7;border:1px solid var(--line);padding:10px;border-radius:10px}.day b{font-size:11px}.shift{font-size:10px;background:var(--pale);padding:8px;border-radius:7px;margin-top:8px;line-height:1.5}.shift:nth-child(even){background:var(--yellow)}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.columns{grid-template-columns:1fr}.app{grid-template-columns:190px 1fr}main{padding:20px}}
@media(max-width:650px){.app{display:block}aside{position:fixed;top:auto;bottom:0;left:0;right:0;width:100%;height:auto;padding:5px;background:white;z-index:5;border-top:1px solid var(--line)}.brand,.navtitle,.sidebottom{display:none}.nav{display:flex;justify-content:space-around;gap:2px}.nav button{flex:1;text-align:center;padding:8px 2px;font-size:9px;white-space:normal}.nav button .icon{display:block;font-size:16px;margin-bottom:3px}main{padding:16px 12px 85px}.hero{padding:19px}.hero h2{font-size:25px}.heroart{display:none}.topbar{align-items:flex-start}.topbar .date{display:none}.topbar .primary{font-size:10px;padding:9px}.stat{padding:13px}.statvalue{font-size:21px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.intro{align-items:flex-start}.intro .primary{white-space:nowrap;font-size:10px}.calendar{grid-template-columns:repeat(2,minmax(110px,1fr))}}
</style>
</head>
<body>
<div class="app">
<aside>
 <div class="brand"><div class="logo">✿</div><div><strong>YONA COMPAGNIE</strong><small>Crèche Manager</small></div></div>
 <div><div class="navtitle">ESPACE DE GESTION</div><nav class="nav" id="nav">
 <button class="active" data-page="dashboard"><span class="icon">⌂ </span>Vue d'ensemble</button>
 <button data-page="children"><span class="icon">🧸 </span>Enfants</button>
 <button data-page="staff"><span class="icon">♙ </span>Équipe</button>
 <button data-page="planning"><span class="icon">▦ </span>Planning</button>
 <button data-page="activities"><span class="icon">✿ </span>Activités</button>
 <button data-page="finance"><span class="icon">€ </span>Finances</button>
 <button data-page="building"><span class="icon">🏡 </span>Travaux</button>
 <button data-page="parents"><span class="icon">♡ </span>Parents</button>
 <button data-page="incidents"><span class="icon">⚑ </span>Incidents</button>
 <button data-page="network"><span class="icon">⌘ </span>Réseau</button>
 </nav></div>
 <div class="sidebottom">🌱 Une équipe sereine et des enfants épanouis : chaque journée compte.<br><br>Sauvegarde automatique sur cet appareil.</div>
</aside>
<main>
 <header class="topbar"><div><div class="eyebrow">CRÈCHE YONA COMPAGNIE</div><h1 id="pageTitle">Bonjour, directrice 🌿</h1><div class="date" id="date"></div></div><button class="primary" onclick="openModal('child')">＋ Inscrire un enfant</button></header>
 <div id="view"></div>
</main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const KEY='yona-creche-v1';
const fresh=()=>({
day:1,money:12500,capacity:24,level:1,satisfaction:86,reputation:72,next:20,
children:[
{id:1,name:'Lina Moreau',age:'18 mois',parent:'Camille Moreau',phone:'06 12 34 56 78',days:'Lun, Mar, Jeu, Ven',fee:480,status:'Inscrit'},
{id:2,name:'Noah Bernard',age:'2 ans',parent:'Julie Bernard',phone:'06 23 45 67 89',days:'Lun, Mar, Mer, Jeu, Ven',fee:520,status:'Inscrit'},
{id:3,name:'Jade Petit',age:'10 mois',parent:'Thomas Petit',phone:'06 34 56 78 90',days:'Lun, Mer, Ven',fee:360,status:'Inscrit'},
{id:4,name:'Adam Garcia',age:'2 ans',parent:'Sarah Garcia',phone:'06 45 67 89 01',days:'Mar, Mer, Jeu',fee:340,status:'Inscrit'},
{id:5,name:'Mia Roux',age:'14 mois',parent:'Nicolas Roux',phone:'06 56 78 90 12',days:'Lun, Mar, Jeu, Ven',fee:430,status:'Inscrit'},
{id:6,name:'Léo Fontaine',age:'20 mois',parent:'Emma Fontaine',phone:'06 67 89 01 23',days:'Lun, Mer, Jeu, Ven',fee:450,status:'Inscrit'}],
staff:[
{id:7,name:'Élodie Martin',role:'Éducatrice de jeunes enfants',qualification:'DEEJE',contract:'CDI',hours:35,salary:2250,status:'En poste'},
{id:8,name:'Sarah Laurent',role:'Auxiliaire de puériculture',qualification:'DEAP',contract:'CDI',hours:35,salary:2050,status:'En poste'},
{id:9,name:'Inès Robert',role:'Auxiliaire petite enfance',qualification:'CAP AEPE',contract:'CDI',hours:35,salary:1900,status:'En poste'},
{id:10,name:'Manon Blanc',role:'Agent polyvalent',qualification:'CAP AEPE',contract:'CDI',hours:28,salary:1550,status:'En poste'}],
activities:[
{id:11,name:'Éveil sensoriel',day:'Lundi',time:'09:30',group:'Petits explorateurs',staff:'Élodie Martin',done:false},
{id:12,name:'Peinture aux doigts',day:'Mardi',time:'10:30',group:'Grands explorateurs',staff:'Inès Robert',done:false},
{id:13,name:'Histoires & comptines',day:'Mercredi',time:'15:00',group:'Tous les enfants',staff:'Sarah Laurent',done:false}],
meals:[
{day:'Lundi',lunch:'Purée de carottes, poulet tendre et semoule',snack:'Compote de pomme et fromage blanc'},
{day:'Mardi',lunch:'Patate douce, poisson et petits pois',snack:'Banane écrasée et yaourt nature'},
{day:'Mercredi',lunch:'Riz fondant, courgettes et lentilles',snack:'Poire mûre et petit-suisse'},
{day:'Jeudi',lunch:'Pâtes, tomate douce et bœuf haché',snack:'Pain moelleux et compote'},
{day:'Vendredi',lunch:'Parmentier de légumes et dinde',snack:'Fruits de saison et yaourt'}],
transactions:[{id:1,label:'Capital de départ',type:'Entrée',amount:12500,category:'Capital',day:1}],
incidents:[],notes:[],
network:[{id:1,name:'Crèche Yona Compagnie',city:'Montpellier',capacity:24,children:6}],
log:[{icon:'🌱',title:'Votre aventure commence',detail:'La crèche est prête à accueillir les familles.',day:1}]
});
let state;
try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){state=fresh()}
const days=['Lundi','Mardi','Mercredi','Jeudi','Vendredi'];
const cash=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=s=>String(s||'?').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
const kids=()=>state.children.filter(x=>x.status==='Inscrit');
const team=()=>state.staff.filter(x=>x.status==='En poste');
let page='dashboard';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function toast(s){document.getElementById('toastRoot').innerHTML='<div class="toast">'+safe(s)+'</div>';setTimeout(()=>document.getElementById('toastRoot').innerHTML='',2600)}
function log(icon,title,detail){state.log.unshift({icon,title,detail,day:state.day});state.log=state.log.slice(0,12)}
function moneyMove(label,type,amount,category){amount=Number(amount);if(!Number.isFinite(amount)||amount<=0)throw Error('Le montant doit être supérieur à zéro.');state.money+=type==='Entrée'?amount:-amount;state.transactions.unshift({id:Date.now(),label,type,amount,category,day:state.day});log(type==='Entrée'?'💶':'🧾',label,type+' : '+cash(amount))}
function go(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo({top:0,behavior:'smooth'})}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
document.getElementById('date').textContent=new Intl.DateTimeFormat('fr-FR',{dateStyle:'full'}).format(new Date());
function title(s){document.getElementById('pageTitle').textContent=s}
function head(s,sub='',action=''){return '<div class="panelhead"><div><h3>'+s+'</h3>'+(sub?'<p>'+sub+'</p>':'')+'</div>'+action+'</div>'}
function stat(label,value,icon,foot){return '<div class="stat"><div class="statlabel"><span>'+label+'</span><span>'+icon+'</span></div><div class="statvalue">'+value+'</div><div class="statfoot">'+foot+'</div></div>'}
function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+(rows||'<tr><td colspan="'+headers.length+'" class="empty">Aucune donnée.</td></tr>')+'</tbody></table></div>'}
function person(name,sub){return '<div class="person"><span class="initial">'+initials(name)+'</span><span><b>'+safe(name)+'</b><small class="muted" style="display:block">'+safe(sub)+'</small></span></div>'}
function dashboard(){
title('Bonjour, directrice 🌿');
return '<section class="hero"><div><div class="eyebrow" style="color:#c4d9cc">JOUR '+state.day+' · VOTRE PREMIÈRE CRÈCHE</div><h2>Un lieu doux pour<br>grandir ensemble.</h2><p>Bienvenue chez Yona Compagnie. Prenez soin des enfants, développez votre équipe et faites grandir votre crèche.</p><button class="primary" onclick="advance()">▶ Démarrer la journée suivante</button></div><div class="heroart">🏡🌳</div></section>'+
'<div class="grid stats">'+stat('Enfants inscrits',kids().length+' / '+state.capacity,'🧸',(state.capacity-kids().length)+' place(s) disponible(s)')+stat('Équipe en poste',team().length,'👩‍🏫','Collaborateurs actifs')+stat('Trésorerie',cash(state.money),'💶','Budget de jeu')+stat('Satisfaction',state.satisfaction+'%','♡','Indice des familles')+'</div>'+
'<div class="grid columns"><div><div class="panel">'+head('Les priorités du jour','Gardez un œil sur la crèche')+'<div class="muted">Occupation des places</div><div class="bar"><span style="width:'+Math.min(100,kids().length/state.capacity*100)+'%"></span></div><div class="muted">Satisfaction des familles : '+state.satisfaction+'%</div><div class="bar"><span style="width:'+state.satisfaction+'%"></span></div><div class="notice">💡 Inscrivez des enfants, recrutez votre équipe et améliorez progressivement les locaux.</div></div><div class="panel">'+head('La vie de la crèche','Dernières nouvelles')+state.log.slice(0,5).map(x=>'<div class="activity"><span class="bubble">'+x.icon+'</span><div><b>'+safe(x.title)+'</b><small>'+safe(x.detail)+' · Jour '+x.day+'</small></div></div>').join('')+'</div></div><div><div class="panel">'+head('Accès rapides','Actions utiles')+'<div class="grid quick"><button onclick="openModal(\'child\')"><span>🧸</span><b>Inscrire un enfant</b><small>Ajouter une famille</small></button><button onclick="openModal(\'staff\')"><span>👩‍🏫</span><b>Recruter</b><small>Agrandir l’équipe</small></button><button onclick="go(\'activities\')"><span>🎨</span><b>Activités</b><small>Organiser la journée</small></button><button onclick="openModal(\'transaction\')"><span>💶</span><b>Comptabilité</b><small>Ajouter une opération</small></button></div></div><div class="panel">'+head('Activités prévues','Programme de la semaine')+state.activities.slice(0,5).map(a=>'<div class="activity"><span class="bubble">🎨</span><div><b>'+safe(a.name)+'</b><small>'+safe(a.day)+' · '+safe(a.time)+' · '+safe(a.group)+'</small></div><span class="pill '+(a.done?'':'warn')+'">'+(a.done?'Fait':'Prévu')+'</span></div>').join('')+'</div></div></div>';
}
function childrenPage(){title('Les enfants 🧸');return '<div class="intro"><div><h2>Les enfants accueillis</h2><p>Gérez les inscriptions et les informations des familles.</p></div><button class="primary" onclick="openModal(\'child\')">＋ Inscrire</button></div><div class="grid stats">'+stat('Inscrits',kids().length,'🧸','Enfants actifs')+stat('Places restantes',Math.max(0,state.capacity-kids().length),'🪑','Capacité actuelle')+stat('Occupation',Math.round(kids().length/state.capacity*100)+'%','📊','Capacité utilisée')+stat('Participations mensuelles',cash(kids().reduce((a,c)=>a+c.fee,0)),'💶','Estimation')+'</div><div class="panel">'+head('Registre des enfants','Fiches de la crèche')+'<div class="filters"><input id="search" placeholder="Rechercher un enfant ou un parent…" oninput="filterTable()"><select id="statusFilter" onchange="filterTable()"><option value="">Tous les statuts</option><option>Inscrit</option><option>En attente</option><option>Sorti</option></select></div><div id="childTable">'+childRows()+'</div></div><p class="muted">Les données de départ sont fictives. N’utilisez pas de données réelles d’enfants dans cette démo.</p>'}
function childRows(){return table(['Enfant','Âge','Parent','Jours','Participation','Statut','Action'],state.children.map(c=>'<tr><td>'+person(c.name,'Dossier '+c.id)+'</td><td>'+safe(c.age)+'</td><td>'+safe(c.parent)+'<div class="muted">'+safe(c.phone)+'</div></td><td>'+safe(c.days)+'</td><td>'+cash(c.fee)+'/mois</td><td><span class="pill '+(c.status==='Sorti'?'bad':c.status==='En attente'?'warn':'')+'">'+safe(c.status)+'</span></td><td><button class="secondary" onclick="manageChild('+c.id+')">Gérer</button></td></tr>').join(''))}
function staffPage(){title('Équipe & recrutement 👩‍🏫');return '<div class="intro"><div><h2>Votre équipe</h2><p>Recrutez et suivez les contrats.</p></div><button class="primary" onclick="openModal(\'staff\')">＋ Recruter</button></div><div class="grid stats">'+stat('Effectif actif',team().length,'👩‍🏫','Collaborateurs')+stat('Masse salariale',cash(team().reduce((a,s)=>a+s.salary,0)),'💶','Salaires mensuels estimés')+stat('Heures / semaine',team().reduce((a,s)=>a+s.hours,0)+' h','◷','Contrats actifs')+stat('Qualifications',state.staff.filter(s=>s.qualification).length,'🎓','Fiches renseignées')+'</div><div class="panel">'+head('Annuaire du personnel','Gérez les fiches')+table(['Collaborateur','Fonction','Qualification','Contrat','Heures','Salaire','Statut','Action'],state.staff.map(s=>'<tr><td>'+person(s.name,'ID '+s.id)+'</td><td>'+safe(s.role)+'</td><td>'+safe(s.qualification)+'</td><td>'+safe(s.contract)+'</td><td>'+s.hours+' h</td><td>'+cash(s.salary)+'</td><td><span class="pill">'+safe(s.status)+'</span></td><td><button class="secondary" onclick="manageStaff('+s.id+')">Gérer</button></td></tr>').join(''))+'</div><div class="panel">'+head('Recrutement rapide','Choisissez un profil')+'<div class="grid quick"><button onclick="openModal(\'staff\',\'Éducatrice de jeunes enfants\')">🎓 <b>Éducateur·rice</b></button><button onclick="openModal(\'staff\',\'Auxiliaire de puériculture\')">🩺 <b>Auxiliaire</b></button><button onclick="openModal(\'staff\',\'Auxiliaire petite enfance\')">🧸 <b>Petite enfance</b></button><button onclick="openModal(\'staff\',\'Agent polyvalent\')">🍎 <b>Agent polyvalent</b></button></div></div>'}
function planningPage(){title('Planning des équipes ▦');return '<div class="intro"><div><h2>Planning hebdomadaire</h2><p>Vue indicative des présences de l’équipe.</p></div><button class="primary" onclick="openModal(\'shift\')">＋ Ajouter un créneau</button></div><div class="notice">Le planning est une simulation : il ne vérifie pas les ratios réglementaires, les pauses ni les qualifications obligatoires en France.</div><div class="panel">'+head('Semaine type','Personnel actuellement actif')+'<div class="calendar">'+days.map((d,i)=>'<div class="day"><b>'+d+'</b>'+team().map((s,j)=>'<div class="shift"><b>'+safe(s.name.split(' ')[0])+'</b><br>'+((i===2&&j===3)?'Repos':'08:00 – '+(s.hours<30?'14:00':'17:00'))+'</div>').join('')+'</div>').join('')+'</div></div><div class="panel">'+head('Ajouter des horaires','Les nouveaux créneaux sont conservés dans le journal')+state.log.filter(x=>x.title==='Créneau ajouté au planning').map(x=>'<div class="activity"><span class="bubble">▦</span><div><b>'+safe(x.detail)+'</b><small>Jour '+x.day+'</small></div></div>').join('')+'</div>'}
function activitiesPage(){title('Repas & activités ✿');return '<div class="intro"><div><h2>Le quotidien des enfants</h2><p>Planifiez les activités et les menus.</p></div><button class="primary" onclick="openModal(\'activity\')">＋ Activité</button></div><div class="grid columns"><div class="panel">'+head('Programme d’activités','Marquez les activités terminées')+state.activities.map(a=>'<div class="activity"><span class="bubble">'+(a.done?'✓':'🎨')+'</span><div style="flex:1"><b>'+safe(a.name)+'</b><small>'+safe(a.day)+' · '+safe(a.time)+' · '+safe(a.group)+'<br>Référent : '+safe(a.staff)+'</small></div><button class="secondary" onclick="toggleActivity('+a.id+')">'+(a.done?'Annuler':'Terminé')+'</button></div>').join('')+'</div><div class="panel">'+head('Menu de la semaine','Exemple à adapter à chaque enfant')+state.meals.map(m=>'<div class="activity"><span class="bubble">🍽️</span><div><b>'+safe(m.day)+'</b><small>Déjeuner : '+safe(m.lunch)+'<br>Goûter : '+safe(m.snack)+'</small></div><button class="secondary" onclick="editMeal(\''+m.day+'\')">Modifier</button></div>').join('')+'<button class="secondary" onclick="openModal(\'meal\')">＋ Ajouter un menu</button><p class="muted">Vérifiez les allergies, les textures et les besoins de chaque enfant.</p></div></div>'}
function financePage(){title('Finances & comptabilité €');const inc=state.transactions.filter(t=>t.type==='Entrée').reduce((a,t)=>a+t.amount,0),out=state.transactions.filter(t=>t.type==='Sortie').reduce((a,t)=>a+t.amount,0);return '<div class="intro"><div><h2>Votre comptabilité</h2><p>Suivez les entrées et sorties simulées.</p></div><button class="primary" onclick="openModal(\'transaction\')">＋ Opération</button></div><div class="grid stats">'+stat('Trésorerie',cash(state.money),'💶','Solde actuel')+stat('Entrées',cash(inc),'↗','Depuis le début')+stat('Sorties',cash(out),'↘','Depuis le début')+stat('Résultat simulé',cash(inc-out),'📈','Entrées moins sorties')+'</div><div class="panel">'+head('Journal des opérations','Toutes les opérations')+table(['Jour','Libellé','Catégorie','Type','Montant'],state.transactions.map(t=>'<tr><td>J'+t.day+'</td><td>'+safe(t.label)+'</td><td>'+safe(t.category)+'</td><td><span class="pill">'+t.type+'</span></td><td>'+ (t.type==='Entrée'?'+':'−')+cash(t.amount)+'</td></tr>').join(''))+'<button class="secondary" onclick="exportCSV()">⇩ Exporter en CSV</button></div><div class="panel">'+head('Charges mensuelles estimées','Hypothèses de jeu')+'<div class="metric">Salaires <b>'+cash(team().reduce((a,s)=>a+s.salary,0))+'</b></div><div class="metric">Repas et consommables <b>'+cash(kids().length*48)+'</b></div><div class="metric">Locaux et énergie <b>'+cash(850*state.level)+'</b></div><div class="metric">Frais divers <b>'+cash(250)+'</b></div><p class="muted">Ces montants ne sont pas une comptabilité réelle ni un calcul de paie.</p></div>'}
function buildingPage(){title('Locaux & travaux 🏡');const lv=[{name:'Accueil chaleureux',cost:0,cap:24},{name:'Salle d’éveil agrandie',cost:2800,cap:30},{name:'Jardin des découvertes',cost:4200,cap:36},{name:'Pôle petite enfance',cost:6500,cap:42}];return '<div class="intro"><div><h2>Votre établissement</h2><p>Investissez dans les espaces et augmentez la capacité.</p></div><span class="pill">Niveau '+state.level+'/4</span></div><div class="hero" style="background:#dcebe1;color:#244a3b"><div><h2>Un environnement<br>pour grandir.</h2><p style="color:#587364">Améliorez le confort et développez votre crèche.</p></div><div class="heroart">🏡🌼🛝</div></div><div class="grid stats">'+stat('Niveau',state.level+'/4','🏡','Améliorations')+stat('Capacité',state.capacity,'🪑','Places théoriques')+stat('Occupées',kids().length,'🧸','Enfants inscrits')+stat('Disponibles',Math.max(0,state.capacity-kids().length),'🌱','Places restantes')+'</div><div class="grid columns">'+lv.map((l,i)=>'<div class="panel">'+head('Niveau '+(i+1)+' · '+l.name,i===0?'Établissement de départ':'Amélioration des locaux')+'<div style="font-size:35px">'+['🏠','🎨','🌳','🏫'][i]+'</div><div class="metric">Capacité après travaux <b>'+l.cap+' places</b></div><div class="metric">Coût <b>'+cash(l.cost)+'</b></div>'+(state.level>i?'<span class="pill">Débloqué</span>':state.level===i?'<button class="primary" '+(i===0?'disabled':'')+' onclick="upgrade('+i+')">Lancer les travaux</button>':'<span class="pill warn">Niveau précédent requis</span>')+'</div>').join('')+'</div>'}
function parentsPage(){title('Relations avec les parents ♡');return '<div class="intro"><div><h2>Les familles</h2><p>Suivez les échanges et la satisfaction.</p></div><button class="primary" onclick="openModal(\'note\')">＋ Ajouter un retour</button></div><div class="grid stats">'+stat('Satisfaction',state.satisfaction+'%','♡','Indice simulé')+stat('Familles',kids().length,'👨‍👩‍👧','Enfants inscrits')+stat('Retours',state.notes.length,'💬','Notes enregistrées')+stat('Réputation',state.reputation+'/100','⭐','Image de la crèche')+'</div><div class="panel">'+head('Carnet des familles','Parents référents')+table(['Enfant','Parent','Téléphone','Jours','Participation','Action'],kids().map(c=>'<tr><td>'+person(c.name,c.age)+'</td><td>'+safe(c.parent)+'</td><td>'+safe(c.phone)+'</td><td>'+safe(c.days)+'</td><td>'+cash(c.fee)+'/mois</td><td><button class="secondary" onclick="contactParent('+c.id+')">Échange</button></td></tr>').join(''))+'</div><div class="panel">'+head('Historique des échanges','Notes de suivi')+state.notes.map(n=>'<div class="activity"><span class="bubble">♡</span><div><b>'+safe(n.parent)+' · '+safe(n.topic)+'</b><small>'+safe(n.note)+' · Jour '+n.day+'</small></div></div>').join('')+'</div>'}
function incidentsPage(){title('Incidents & imprévus ⚑');return '<div class="intro"><div><h2>Registre des événements</h2><p>Consignez les imprévus de cette simulation.</p></div><button class="primary" onclick="openModal(\'incident\')">＋ Déclarer</button></div><div class="notice">Dans une vraie crèche, appliquez les procédures officielles de sécurité et d’information des responsables légaux. Ce registre ne remplace aucune procédure.</div><div class="panel">'+head('Registre des événements','Événements enregistrés')+table(['Jour','Type','Description','Suivi','Statut','Action'],state.incidents.map(i=>'<tr><td>J'+i.day+'</td><td>'+safe(i.type)+'</td><td>'+safe(i.description)+'</td><td>'+safe(i.followup)+'</td><td><span class="pill">'+safe(i.status)+'</span></td><td><button class="secondary" onclick="closeIncident('+i.id+')">Clôturer</button></td></tr>').join(''))+'</div>'}
function networkPage(){title('Mon réseau de crèches ⌘');return '<div class="intro"><div><h2>Votre réseau Yona</h2><p>Commencez avec une crèche et développez votre groupe.</p></div><button class="primary" onclick="openModal(\'network\')">＋ Ajouter une crèche</button></div><div class="grid stats">'+stat('Établissements',state.network.length,'🏡','Dans le réseau')+stat('Capacité cumulée',state.network.reduce((a,n)=>a+n.capacity,0),'🪑','Places théoriques')+stat('Enfants inscrits',state.network.reduce((a,n)=>a+n.children,0),'🧸','Tous les sites')+stat('Trésorerie',cash(state.money),'💶','Budget du jeu')+'</div><div class="grid columns">'+state.network.map(n=>'<div class="panel">'+head(n.name,n.city)+'<div style="font-size:35px">🏡</div><div class="metric">Capacité <b>'+n.capacity+'</b></div><div class="metric">Enfants <b>'+(n.id===1?kids().length:n.children)+'</b></div><div class="metric">Statut <span class="pill">Ouverte</span></div>'+(n.id===1?'<button class="secondary" onclick="go(\'dashboard\')">Gérer</button>':'<button class="secondary" onclick="removeSite('+n.id+')">Retirer</button>')+'</div>').join('')+'</div><div class="notice">Les établissements secondaires sont simplifiés : ils partagent le budget et n’ont pas encore de gestion indépendante.</div>'}
function render(){const pages={dashboard,children:childrenPage,staff:staffPage,planning:planningPage,activities:activitiesPage,finance:financePage,building:buildingPage,parents:parentsPage,incidents:incidentsPage,network:networkPage};document.getElementById('view').innerHTML=(pages[page]||dashboard)();save()}
function filterTable(){const q=(document.getElementById('search')?.value||'').toLowerCase(),s=document.getElementById('statusFilter')?.value||'';document.querySelectorAll('#childTable tbody tr').forEach(tr=>{tr.style.display=tr.innerText.toLowerCase().includes(q)&&(!s||tr.innerText.includes(s))?'':'none'})}
function manageChild(id){const c=state.children.find(x=>x.id===id);if(!c)return;const a=prompt('Gestion de '+c.name+'\n1 : Modifier statut\n2 : Modifier participation mensuelle\n3 : Supprimer la fiche\n\nSaisissez 1, 2 ou 3');if(a==='1'){const s=prompt('Statut : Inscrit, En attente ou Sorti',c.status);if(['Inscrit','En attente','Sorti'].includes(s))c.status=s}else if(a==='2'){const v=Number(prompt('Participation mensuelle (€)',c.fee));if(v>=0&&Number.isFinite(v))c.fee=v}else if(a==='3'&&confirm('Supprimer cette fiche ?'))state.children=state.children.filter(x=>x.id!==id);render()}
function manageStaff(id){const s=state.staff.find(x=>x.id===id);if(!s)return;const a=prompt('Gestion de '+s.name+'\n1 : Modifier salaire\n2 : Modifier statut\n3 : Supprimer\n\nSaisissez 1, 2 ou 3');if(a==='1'){const v=Number(prompt('Salaire mensuel estimé (€)',s.salary));if(v>0&&Number.isFinite(v))s.salary=v}else if(a==='2'){const v=prompt('Statut : En poste, Congé ou Parti',s.status);if(['En poste','Congé','Parti'].includes(v))s.status=v}else if(a==='3'&&confirm('Supprimer cette fiche ?'))state.staff=state.staff.filter(x=>x.id!==id);render()}
function toggleActivity(id){const a=state.activities.find(x=>x.id===id);if(a){a.done=!a.done;if(a.done)state.satisfaction=Math.min(100,state.satisfaction+1);log('🎨',a.done?'Activité terminée':'Activité rouverte',a.name);render()}}
function upgrade(i){const cost=[0,2800,4200,6500][i],cap=[24,30,36,42][i];if(i!==state.level||i===0)return;if(state.money<cost)return toast('Trésorerie insuffisante.');if(!confirm('Lancer les travaux pour '+cash(cost)+' ?'))return;moneyMove('Travaux niveau '+(i+1),'Sortie',cost,'Travaux');state.level=i+1;state.capacity=cap;log('🏡','Travaux terminés','Capacité portée à '+cap+' places');render();toast('Travaux terminés !')}
function closeIncident(id){const i=state.incidents.find(x=>x.id===id);if(i){i.status='Clôturé';render();toast('Événement clôturé.')}}
function removeSite(id){if(confirm('Retirer cet établissement ?')){state.network=state.network.filter(x=>x.id!==id);render()}}
function contactParent(id){const c=state.children.find(x=>x.id===id);openModal('note',{parent:c.parent,child:c.name})}
function advance(){state.day++;const k=kids().length,cost=Math.round(team().reduce((a,s)=>a+s.salary,0)/30+k*7+35);moneyMove('Recettes quotidiennes simulées','Entrée',Math.max(10,k*18),'Accueil');moneyMove('Frais quotidiens simulés','Sortie',Math.max(10,cost),'Fonctionnement');const r=Math.random();if(r<.34){state.satisfaction=Math.min(100,state.satisfaction+2);log('🌼','Belle journée','Les activités se sont bien déroulées.')}else if(r<.67){state.satisfaction=Math.max(40,state.satisfaction-2);log('🌧️','Petit imprévu','Une famille demande un suivi.')}else{state.reputation=Math.min(100,state.reputation+1);log('⭐','Bonne réputation','Une famille recommande la crèche.')}render();toast('Nouvelle journée · Jour '+state.day)}
function exportCSV(){const rows=[['Jour','Libellé','Catégorie','Type','Montant'],...state.transactions.map(t=>['J'+t.day,t.label,t.category,t.type,t.amount])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='yona-comptabilite.csv';a.click();URL.revokeObjectURL(url)}
function editMeal(day){const m=state.meals.find(x=>x.day===day);openModal('meal',m)}
function openModal(type,preset={}){let heading='',fields='',action='';const opts=(a)=>a.map((x,i)=>'<option value="'+safe(x)+'" '+(i===0?'selected':'')+'>'+safe(x)+'</option>').join('');const input=(n,l,p='',full=false)=>'<div class="field '+(full?'full':'')+'"><label>'+l+'</label><input name="'+n+'" placeholder="'+safe(p)+'" required></div>';const select=(n,l,a)=>'<div class="field"><label>'+l+'</label><select name="'+n+'">'+opts(a)+'</select></div>';const area=(n,l,p)=>'<div class="field full"><label>'+l+'</label><textarea name="'+n+'" placeholder="'+safe(p)+'" required></textarea></div>';
if(type==='child'){heading='Nouvelle inscription';action='child';fields='<div class="formgrid">'+input('name','Nom et prénom','Ex. Zoé Martin')+input('age','Âge','Ex. 16 mois')+input('parent','Parent référent','Nom du parent')+input('phone','Téléphone','06…')+input('days','Jours d’accueil','Lun, Mar, Jeu')+input('fee','Participation mensuelle (€)','450')+select('status','Statut',['Inscrit','En attente'])+'</div>'}
if(type==='staff'){heading='Recruter un membre';action='staff';fields='<div class="formgrid">'+input('name','Nom et prénom','Ex. Léa Martin')+select('role','Fonction',['Éducatrice de jeunes enfants','Auxiliaire de puériculture','Auxiliaire petite enfance','Agent polyvalent','Infirmier·ère'])+input('qualification','Diplôme / qualification','CAP AEPE')+select('contract','Contrat',['CDI','CDD','Temps partiel','Apprentissage'])+input('hours','Heures par semaine','35')+input('salary','Salaire mensuel estimé (€)','1900')+'</div>'}
if(type==='transaction'){heading='Nouvelle opération';action='transaction';fields=input('label','Libellé','Achat de matériel',true)+select('type','Type',['Entrée','Sortie'])+'<div class="formgrid">'+input('amount','Montant (€)','250')+select('category','Catégorie',['Accueil','Salaires','Repas','Matériel','Travaux','Capital','Fonctionnement','Autre'])+'</div>'}
if(type==='activity'){heading='Créer une activité';action='activity';fields='<div class="formgrid">'+input('name','Nom de l’activité','Parcours moteur')+input('time','Horaire','10:00')+select('day','Jour',days)+select('group','Groupe',['Petits explorateurs','Grands explorateurs','Tous les enfants'])+input('staff','Référent','Membre de l’équipe',true)+'</div>'}
if(type==='meal'){heading='Modifier le menu';action='meal';fields=select('day','Jour',days)+input('lunch','Déjeuner','Plat principal',true)+input('snack','Goûter','Collation',true)}
if(type==='incident'){heading='Déclarer un événement';action='incident';fields=select('type','Type',['Organisation','Matériel','Santé / sécurité','Famille','Locaux','Autre'])+input('description','Description','Décrivez la situation',true)+input('followup','Suivi prévu','Action à réaliser',true)}
if(type==='note'){heading='Échange avec une famille';action='note';fields=input('parent','Parent référent',preset.parent||'Nom du parent',true)+select('topic','Sujet',['Retour positif','Question','Demande de suivi','Organisation','Autre'])+area('note','Note de suivi','Résumé bref de l’échange')}
if(type==='shift'){heading='Ajouter un créneau';action='shift';fields=select('staff','Membre de l’équipe',team().map(s=>s.name).concat(['À définir']))+select('day','Jour',days)+input('start','Début','08:00')+input('end','Fin','17:00')}
if(type==='network'){heading='Ajouter une crèche';action='network';fields=input('name','Nom de la crèche','Les Petits Yonas',true)+input('city','Ville','Nîmes',true)+'<div class="formgrid">'+input('capacity','Capacité','12')+input('children','Enfants inscrits','0')+'</div>'}
document.getElementById('modalRoot').innerHTML='<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h3>'+heading+'</h3><button class="secondary" type="button" onclick="closeModal()">✕</button></div><form onsubmit="submitForm(event,\''+action+'\')">'+fields+'<div class="modalfoot"><button type="button" class="secondary" onclick="closeModal()">Annuler</button><button type="submit" class="primary">Enregistrer</button></div></form></div></div>';
if(type==='meal'&&preset){const form=document.querySelector('#modalRoot form');if(preset.day)form.elements.day.value=preset.day;if(preset.lunch)form.elements.lunch.value=preset.lunch;if(preset.snack)form.elements.snack.value=preset.snack}
if(type==='note'&&preset.parent)document.querySelector('#modalRoot [name=parent]').value=preset.parent;
}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function submitForm(e,action){e.preventDefault();const f=Object.fromEntries(new FormData(e.target).entries());try{
if(action==='child'){if(kids().length>=state.capacity)throw Error('La crèche est complète.');if(+f.fee<0)throw Error('Participation invalide.');state.children.push({id:state.next++,...f,fee:+f.fee});log('🧸','Nouvelle inscription',f.name);page='children';toast('Inscription enregistrée.')}
if(action==='staff'){if(+f.salary<=0||+f.hours<=0)throw Error('Vérifiez le salaire et les heures.');state.staff.push({id:state.next++,...f,salary:+f.salary,hours:+f.hours,status:'En poste'});log('👩‍🏫','Recrutement effectué',f.name);page='staff';toast('Recrutement enregistré.')}
if(action==='transaction'){moneyMove(f.label,f.type,f.amount,f.category);page='finance';toast('Opération enregistrée.')}
if(action==='activity'){state.activities.push({id:state.next++,...f,done:false});log('🎨','Activité ajoutée',f.name);page='activities';toast('Activité ajoutée.')}
if(action==='meal'){const old=state.meals.find(m=>m.day===f.day);if(old)Object.assign(old,f);else state.meals.push(f);page='activities';toast('Menu enregistré.')}
if(action==='incident'){state.incidents.unshift({id:state.next++,...f,day:state.day,status:'À suivre'});state.satisfaction=Math.max(40,state.satisfaction-1);log('⚑','Événement enregistré',f.type);page='incidents';toast('Événement enregistré.')}
if(action==='note'){state.notes.unshift({...f,day:state.day});if(f.topic==='Retour positif'){state.satisfaction=Math.min(100,state.satisfaction+2);state.reputation=Math.min(100,state.reputation+1)}log('♡','Échange avec une famille',f.parent+' · '+f.topic);page='parents';toast('Échange enregistré.')}
if(action==='shift'){log('▦','Créneau ajouté au planning',f.staff+' · '+f.day+' · '+f.start+'–'+f.end);page='planning';toast('Créneau ajouté au journal.')}
if(action==='network'){if(+f.capacity<1||+f.children<0||+f.children>+f.capacity)throw Error('Vérifiez capacité et effectif.');state.network.push({id:state.next++,...f,capacity:+f.capacity,children:+f.children});log('🏡','Nouvel établissement',f.name+' · '+f.city);page='network';toast('Crèche ajoutée au réseau.')}
closeModal();render()
}catch(err){toast(err.message||'Erreur lors de l’enregistrement.')}}
render();
</script>
</body>
</html>
